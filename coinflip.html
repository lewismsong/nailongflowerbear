<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>coin flip 🐻‍❄️🐻</title>
<meta name="theme-color" content="#F3DDC1" />
<link rel="icon" href="assets/images/optimized/bear-with-flower.webp" />
<script src="assets/js/platform.js?v=2"></script>
<script src="assets/js/auth-guard.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" />
<link rel="stylesheet" href="assets/css/base.css?v=12" />

<script src="assets/js/seasonal-theme.js?v=1"></script>
</head>
<body class="coinflip-page">
<main class="coinflip-wrap">
  <header class="coinflip-header">
    <p class="coinflip-eyebrow">🐻‍❄️ or 🐻</p>
    <h1>coin flip</h1>
    <p>decisions are hard...</p>
  </header>

  <section class="coin-stage" aria-labelledby="coin-result">
    <div class="coin-glow" aria-hidden="true"></div>
    <button class="coin-shell" id="coin" type="button" aria-label="flip the coin">
      <span class="coin">
        <span class="coin-face coin-white">
          <span class="coin-bear" aria-hidden="true">🐻‍❄️</span>
          <span class="coin-side-name">white bear</span>
        </span>
        <span class="coin-face coin-brown">
          <span class="coin-bear" aria-hidden="true">🐻</span>
          <span class="coin-side-name">brown bear</span>
        </span>
        <span class="coin-face coin-koala">
          <span class="coin-koala-icon" aria-hidden="true">🐨</span>
          <span class="coin-koala-caption">the rare koala appeared!</span>
        </span>
      </span>
    </button>
    <div class="coin-shadow" aria-hidden="true"></div>
  </section>

  <p class="coin-result" id="coin-result" aria-live="polite">tap the coin to flip</p>
</main>

<bear-tab-nav current="coinflip"></bear-tab-nav>

<script defer src="assets/js/coinflip.js?v=7"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script defer src="assets/js/shared-settings.js?v=1"></script>
<script defer src="assets/js/navigation.js?v=25"></script>
<script defer src="assets/js/all-time-adjustments.js?v=4"></script>
<script defer src="assets/js/pixel-companions.js?v=18"></script>
<script defer src="assets/js/daisy-companion.js?v=2"></script>
</body>
</html>
