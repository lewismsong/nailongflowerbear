<body class="daisy-park-page">
<main class="daisy-home">
  <header><h1>daisy’s park 🌼</h1></header>
  <section class="park-layout" aria-label="daisy’s park and toys">
    <div id="daisy-park" class="daisy-park" aria-label="daisy’s own play area">
      <button id="daisy-lake" class="daisy-lake" aria-label="let daisy swim in the lake"><img src="assets/images/daisy-lake.svg?v=2" alt="a pixel-art pond with a sandy bank and reeds" draggable="false" /></button>
      <button id="daisy-bed" class="daisy-bed" aria-label="let daisy rest in her bed"><img src="assets/images/daisy-bed.svg?v=2" alt="a cushioned dog bed with raised sides and a bone badge" draggable="false" /></button>
    </div>
    <div class="park-toys" role="group" aria-label="daisy’s toys">
      <button id="lake-option" type="button"><img src="assets/images/daisy-lake.svg?v=2" alt="" draggable="false" />lake</button>
      <button id="bed-option" type="button"><img src="assets/images/daisy-bed.svg?v=2" alt="" draggable="false" />doggy bed</button>
    </div>
  </section>
  <p id="daisy-status" class="daisy-status" role="status">a park just for daisy.</p>
</main>
