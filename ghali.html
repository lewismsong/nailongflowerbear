<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#172c22" />
<title>ghali + gakku</title>
<script src="assets/js/profile-route.js?v=1"></script>
<link rel="stylesheet" href="assets/css/ghali.css?v=1" />
<script defer src="assets/js/platform.js?v=2"></script>
<script defer src="assets/js/ghali.js?v=1"></script>
</head>
<body>
<main class="ghali-room">
  <header><div><p class="eyebrow">a little secret</p><h1>hi, ghali.</h1></div><button id="ghali-signout" class="signout" type="button">not you?</button></header>
  <section class="miss-room" aria-label="gakku's miss screen">
    <span class="spark spark-one" aria-hidden="true">✧</span><span class="spark spark-two" aria-hidden="true">✧</span>
    <p class="room-note">someone small is thinking of you.</p>
    <div class="gakku-halo">
      <button id="gakku-button" type="button" aria-label="Send Gakku a little miss">
        <svg class="gakku" viewBox="0 0 240 260" fill="none" aria-hidden="true">
          <defs><linearGradient id="gakku-green" x1="70" y1="35" x2="180" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#e1f5b4"/><stop offset=".55" stop-color="#c3e78c"/><stop offset="1" stop-color="#9acb70"/></linearGradient></defs>
          <ellipse cx="119" cy="235" rx="64" ry="9" fill="#a4d37a" opacity=".15"/>
          <path d="M164 207c52 15 63-20 43-34-14-10-26 2-20 13" stroke="#acd77d" stroke-width="19" stroke-linecap="round"/>
          <path d="M80 135c-9 20-13 60-8 83 2 12 16 15 29 11h39c16 4 27-1 29-13 4-32-2-64-11-81" fill="url(#gakku-green)"/>
          <path d="M61 82c-5-21-4-43 5-48 8-4 22 15 30 25 15-6 34-6 49 0 9-11 23-29 31-25 10 6 10 32 4 53 5 12 7 25 3 36-8 26-39 35-63 35-28 0-55-10-62-35-4-15-2-28 3-41Z" fill="url(#gakku-green)"/>
          <ellipse cx="98" cy="105" rx="4" ry="5" fill="#314d37"/><ellipse cx="144" cy="105" rx="4" ry="5" fill="#314d37"/>
          <path d="m117 117 4 3 4-3M121 120v4" stroke="#668454" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M89 159c-9 13-8 30 3 35M152 159c10 13 9 30-2 35" stroke="#9fcf77" stroke-width="13" stroke-linecap="round"/>
          <path d="M105 210v18M137 210v18" stroke="#8cba67" stroke-width="3" stroke-linecap="round" opacity=".55"/>
          <path d="M78 77c5-7 8-9 12-10" stroke="#f0ffce" stroke-width="6" stroke-linecap="round" opacity=".45"/>
        </svg>
        <span class="gakku-name">gakku</span><span class="button-note">i miss you</span>
      </button>
    </div>
    <p id="ghali-response" class="response" role="status">a tiny glow, just for you.</p>
    <div class="miss-total"><strong id="ghali-count">0</strong><span>little misses</span></div>
    <p class="secret-note">our secret green corner.</p>
  </section>
  <div id="ghali-sparks" aria-hidden="true"></div>
</main>
</body>
</html>
