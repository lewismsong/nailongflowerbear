<body class="pakku-house-page">
<main class="pakku-home">
  <h1>pakku’s house 🤍</h1>
  <section class="pakku-playroom" aria-label="Pakku’s playroom">
    <div id="pakku-sandbox" class="pakku-sandbox" aria-label="Pakku’s play area" tabindex="0">
      <img class="sandbox-whale" src="assets/images/optimized/pakku-whale.webp" alt="Poofy, a blue crochet whale plush with a cream belly" draggable="false" />
      <button id="sandbox-slide" class="sandbox-slide" type="button" aria-label="Let Pakku ride the slide">
        <img src="assets/images/optimized/pakku-slide.webp" alt="A pink slide with a wooden ladder" draggable="false" />
      </button>
      <button id="sandbox-yarn" class="sandbox-yarn" type="button" aria-label="Roll the yarn ball for Pakku">
        <img src="assets/images/optimized/pakku-yarn.webp" alt="A mint-green ball of yarn" draggable="false" />
      </button>
      <button id="sandbox-suitcase" class="sandbox-suitcase" type="button" aria-label="Let Pakku sit in the suitcase"><span class="suitcase-art" aria-hidden="true"><span></span><span></span></span></button>
      <button id="sandbox-trampoline" class="sandbox-trampoline" type="button" aria-label="Bounce Pakku three times"><img src="assets/images/optimized/pakku-trampoline.webp" alt="A powder-blue trampoline" draggable="false" /></button>
    </div>
    <div class="sandbox-toys" role="group" aria-label="Pakku’s toys">
      <button id="slide-option" class="toy-slot selected" type="button" aria-label="Play on the slide">
        <img src="assets/images/optimized/pakku-slide.webp" alt="" draggable="false" />
        <span>slide</span>
      </button>
      <button id="yarn-option" class="toy-slot" type="button" aria-label="Play with the yarn ball">
        <img src="assets/images/optimized/pakku-yarn.webp" alt="" draggable="false" />
        <span>yarn</span>
      </button>
      <button id="suitcase-option" class="toy-slot" type="button" aria-label="Sit in the suitcase"><span class="suitcase-art" aria-hidden="true"><span></span><span></span></span><span>suitcase</span></button>
      <button id="trampoline-option" class="toy-slot" type="button" aria-label="Bounce on the trampoline"><img src="assets/images/optimized/pakku-trampoline.webp" alt="" draggable="false" /><span>trampoline</span></button>
    </div>
  </section>
</main>

</body>
</html>
