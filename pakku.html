<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>pakku’s house 🤍</title>
<meta name="theme-color" content="#FFE0DC" />
<link rel="icon" href="assets/images/pakku.png" />
<script src="assets/js/platform.js?v=2"></script>
<script src="assets/js/auth-guard.js?v=1"></script>
<link rel="stylesheet" href="assets/css/base.css?v=4" />
<link rel="stylesheet" href="assets/css/pixel-companions.css?v=4" />
<link rel="stylesheet" href="assets/css/pakku-sandbox.css?v=5" />
</head>
<body class="pakku-house-page">
<main class="pakku-home">
  <h1>pakku’s house 🤍</h1>
  <section class="pakku-playroom" aria-label="Pakku’s playroom">
    <div id="pakku-sandbox" class="pakku-sandbox" aria-label="Pakku’s play area" tabindex="0">
      <span class="sandbox-caption" aria-hidden="true">pakku’s little home</span>
      <button id="sandbox-slide" class="sandbox-slide" type="button" aria-label="Let Pakku ride the slide">
        <img src="assets/images/pakku-slide.png" alt="A pink slide with a wooden ladder" draggable="false" />
      </button>
      <button id="sandbox-yarn" class="sandbox-yarn" type="button" aria-label="Roll the yarn ball for Pakku">
        <img src="assets/images/pakku-yarn.png" alt="A mint-green ball of yarn" draggable="false" />
      </button>
      <button id="sandbox-suitcase" class="sandbox-suitcase" type="button" aria-label="Let Pakku sit in the suitcase"><span class="suitcase-art" aria-hidden="true"><span></span><span></span></span></button>
    </div>
    <div class="sandbox-toys" role="group" aria-label="Pakku’s toys">
      <button id="slide-option" class="toy-slot selected" type="button" aria-label="Play on the slide">
        <img src="assets/images/pakku-slide.png" alt="" draggable="false" />
        <span>slide</span>
      </button>
      <button id="yarn-option" class="toy-slot" type="button" aria-label="Play with the yarn ball">
        <img src="assets/images/pakku-yarn.png" alt="" draggable="false" />
        <span>yarn</span>
      </button>
      <button id="suitcase-option" class="toy-slot" type="button" aria-label="Sit in the suitcase"><span class="suitcase-art" aria-hidden="true"><span></span><span></span></span><span>suitcase</span></button>
      <div class="toy-slot empty" aria-label="Empty toy slot 4"></div>
    </div>
  </section>
  <p class="sandbox-status" id="sandbox-status" role="status">pakku is out exploring.</p>
</main>
<bear-tab-nav current="pakku"></bear-tab-nav>
<script src="assets/js/navigation.js?v=19"></script>
<script src="assets/js/all-time-adjustments.js?v=4"></script>
<script src="assets/js/pakku-sandbox.js?v=5"></script>
<script src="assets/js/pixel-companions.js?v=9"></script>
</body>
</html>
