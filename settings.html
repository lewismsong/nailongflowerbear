<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>settings 🤍</title>
<meta name="theme-color" content="#F3DDC1" />
<link rel="icon" href="assets/images/optimized/pakku.webp" />
<script src="assets/js/platform.js?v=2"></script>
<script src="assets/js/auth-guard.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" />
<link rel="stylesheet" href="assets/css/base.css?v=12" />
<link rel="stylesheet" href="assets/css/seasonal-theme.css?v=1" />
<link rel="stylesheet" href="assets/css/settings.css?v=1" />
<script src="assets/js/seasonal-theme.js?v=1"></script>
</head>
<body>
<main class="settings-page">
  <a class="back-link" href="index.html">← home</a>
  <h1>settings</h1>
  <p class="settings-intro">change colours and pakku's house across devices</p>
  <form id="settings-form">
    <fieldset id="settings-fields" disabled>
      <section aria-labelledby="colours-title">
        <h2 id="colours-title">accent colours</h2>
        <div class="colour-rows">
          <div class="colour-row">
            <label for="khali-hex">khali <span aria-hidden="true">🐻‍❄️</span></label>
            <div class="colour-controls"><button class="colour-swatch" id="khali-swatch" type="button" data-person="khali" aria-label="Choose Khali’s accent colour" aria-haspopup="dialog"></button><input id="khali-hex" aria-label="Khali’s hex colour" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#EDB878" required pattern="#?[0-9a-fA-F]{6}" /></div>
          </div>
          <div class="colour-row">
            <label for="lewis-hex">lewis <span aria-hidden="true">🐻</span></label>
            <div class="colour-controls"><button class="colour-swatch" id="lewis-swatch" type="button" data-person="lewis" aria-label="Choose Lewis’ accent colour" aria-haspopup="dialog"></button><input id="lewis-hex" aria-label="Lewis’ hex colour" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#EF948F" required pattern="#?[0-9a-fA-F]{6}" /></div>
          </div>
        </div>
      </section>
      <section class="house-section" aria-labelledby="house-title">
        <h2 id="house-title">pakku’s house</h2>
        <div class="house-options">
          <label class="house-option"><input type="radio" name="house" value="temple" /><span class="house-preview"><img src="assets/images/optimized/chinese-temple.webp" alt="A Chinese temple" /></span><span class="house-caption">temple</span></label>
          <label class="house-option"><input type="radio" name="house" value="cat-house" /><span class="house-preview"><img src="assets/images/optimized/cat-house.webp" alt="A little cat house" /></span><span class="house-caption">cat house</span></label>
          <label class="house-option"><input type="radio" name="house" value="koala-tree" /><span class="house-preview"><img src="assets/images/optimized/mango-tree-heart.webp" alt="an autumn mango tree with tiny green mangoes" /></span><span class="house-caption">mango tree</span></label>
        </div>
      </section>
    </fieldset>
    <footer class="settings-footer"><p id="settings-status" class="settings-status" role="status">loading shared settings…</p><div class="settings-actions"><a id="cancel-settings" href="index.html" class="cancel-button">cancel</a><button id="apply-settings" type="submit" disabled>apply</button></div></footer>
  </form>
</main>
<dialog id="colour-dialog" aria-labelledby="picker-title">
  <div class="picker-heading"><h2 id="picker-title">choose a colour</h2><button id="close-picker" type="button" aria-label="Close colour picker">×</button></div>
  <canvas id="colour-wheel" width="200" height="200" tabindex="0" aria-label="Colour wheel. Drag to choose a colour, or use left and right arrows for hue and up and down arrows for saturation."></canvas>
  <label class="brightness-label" for="colour-brightness">brightness</label><input id="colour-brightness" type="range" min="0" max="100" value="100" />
  <p id="picker-hex" aria-live="polite"></p>
  <button id="done-picker" type="button">done</button>
</dialog>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script defer src="assets/js/config.js?v=2"></script>
<script defer src="assets/js/settings-model.js?v=4"></script>
<script defer src="assets/js/shared-settings.js?v=1"></script>
<script defer src="assets/js/settings.js?v=1"></script>
</body>
</html>
