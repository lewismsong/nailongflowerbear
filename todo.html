<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>our list 🐻‍❄️🐻</title>
<meta name="theme-color" content="#FFF4D6" />
<link rel="icon" href="assets/images/bears.jpg" />
<script src="assets/js/platform.js?v=2"></script>
<script src="assets/js/auth-guard.js?v=1"></script>
<link rel="stylesheet" href="assets/css/base.css?v=4" />
<link rel="stylesheet" href="assets/css/pixel-companions.css?v=3" />
<link rel="stylesheet" href="assets/css/todo.css?v=9" />
</head>
<body class="todo-page">
<main class="todo-wrap">
  <a class="back-link" href="index.html">← back home</a>

  <header class="todo-header">
    <div>
      <p class="todo-eyebrow">🐻‍❄️ + 🐻</p>
      <h1>list</h1>
      <p class="todo-sub">scratchpad for all kinds of things</p>
    </div>
    <div class="todo-person" id="todo-person"></div>
  </header>

  <div class="todo-tab-row">
    <div id="todo-tabs" class="todo-tabs" role="tablist" aria-label="lists"></div>
    <button type="button" class="todo-tab-add" id="todo-list-add" aria-label="add a new list">+</button>
  </div>
  <div class="todo-tab-actions">
    <button type="button" id="todo-list-rename">rename</button>
    <button type="button" id="todo-list-delete">delete</button>
  </div>

  <section class="scratchpad" id="todo-panel" role="tabpanel" aria-label="todo list">
    <div class="todo-progress">
      <div class="todo-progress-copy">
        <span id="todo-count">choose a list</span>
        <span id="todo-progress-text">0 of 0 done</span>
      </div>
      <div class="todo-progress-track" aria-hidden="true">
        <span id="todo-progress-bar"></span>
      </div>
    </div>

    <form id="todo-form" class="todo-form">
      <span id="my-bear" class="my-bear" aria-hidden="true"></span>
      <input id="todo-input" maxlength="280" placeholder="write something" autocomplete="off" />
      <button type="submit">add</button>
    </form>

    <p id="todo-empty" class="todo-empty">nothing here yet</p>
    <ul id="todo-list" class="todo-list"></ul>
    <p id="todo-error" class="todo-error" role="status"></p>
  </section>
</main>

<bear-tab-nav current="todo"></bear-tab-nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/todo.js?v=9"></script>
<script src="assets/js/navigation.js?v=19"></script>
<script src="assets/js/all-time-adjustments.js?v=4"></script>
<script src="assets/js/pixel-companions.js?v=7"></script>
</body>
</html>
