<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>our trips 🧳</title>
<meta name="theme-color" content="#FFF4D6" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>" />
<script src="assets/js/platform.js?v=2"></script>
<script src="assets/js/auth-guard.js?v=1"></script>
<link rel="stylesheet" href="assets/css/base.css?v=2" />
<link rel="stylesheet" href="assets/css/pixel-companions.css?v=2" />
<link rel="stylesheet" href="assets/css/trips.css?v=1" />
</head>
<body class="trips-page">
<main class="trips-wrap">
  <a class="back-link" href="index.html">← back home</a>

  <header class="trips-header">
    <p class="trips-eyebrow">🐻‍❄️ + 🐻 go to</p>
    <h1>our trips</h1>
  </header>

  <p class="trips-kicker">next trip</p>
  <a class="trip-card trip-next" href="shanghai.html">
    <span class="trip-flag" aria-hidden="true">🇨🇳</span>
    <span class="trip-body">
      <span class="trip-name">shanghai</span>
      <span class="trip-when" data-trip="shanghai">no dates yet, we're working on it</span>
    </span>
    <span class="trip-go" aria-hidden="true">→</span>
  </a>

  <p class="trips-kicker">the rest</p>
  <a class="trip-card" href="france.html">
    <span class="trip-flag" aria-hidden="true">🇫🇷</span>
    <span class="trip-body">
      <span class="trip-name">france</span>
      <span class="trip-when" data-trip="france">aug 13 - aug 27, 2026</span>
    </span>
    <span class="trip-go" aria-hidden="true">→</span>
  </a>
  <a class="trip-card" href="berlin.html">
    <span class="trip-flag" aria-hidden="true">🇩🇪</span>
    <span class="trip-body">
      <span class="trip-name">berlin</span>
      <span class="trip-when" data-trip="berlin">2026</span>
    </span>
    <span class="trip-go" aria-hidden="true">→</span>
  </a>
  <a class="trip-card" href="toronto.html">
    <span class="trip-flag" aria-hidden="true">🇨🇦</span>
    <span class="trip-body">
      <span class="trip-name">toronto</span>
      <span class="trip-when" data-trip="toronto">dates tbd</span>
    </span>
    <span class="trip-go" aria-hidden="true">→</span>
  </a>
</main>

<bear-tab-nav current="trips"></bear-tab-nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/trips.js?v=1"></script>
<script src="assets/js/navigation.js?v=17"></script>
<script src="assets/js/all-time-adjustments.js?v=4"></script>
<script src="assets/js/pixel-companions.js?v=3"></script>
</body>
</html>
